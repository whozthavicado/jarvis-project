[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first personal voice assistant for an 8GB MacBook (see ARCHITECTURE.md)"
requires-python = ">=3.9"
dependencies = [
    "sounddevice>=0.4.6",   # mic capture (PortAudio binding)
    "numpy>=1.24",          # audio buffers
    "webrtcvad-wheels>=2.0.14",  # prebuilt VAD wheels (import name: webrtcvad)
    "httpx>=0.27",          # whisper-server HTTP client
    "pyyaml>=6.0",          # settings/grammar
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvis-m1 = "scripts.milestone1:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis", "jarvis.audio", "jarvis.speech"]
