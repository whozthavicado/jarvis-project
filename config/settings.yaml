# Single source of truth for tunables. Code reads this — never hardcode model IDs
# or audio params. See ARCHITECTURE.md §6.

audio:
  sample_rate: 16000      # whisper.cpp + webrtcvad require 16 kHz mono
  channels: 1
  frame_ms: 30            # webrtcvad accepts only 10 / 20 / 30 ms frames
  device: null            # null = system default input device
  # If the primary device above produces no real signal at startup (common
  # with Bluetooth headsets stuck in A2DP/output-only mode -- macOS doesn't
  # always force a headset into HFP mic mode just because an app opened an
  # input stream), MicCapture probes each of these, in order, and uses the
  # first one with real signal. This machine's system-default input
  # (AirPods) tested silent; the built-in mic (device index 3) tested loud
  # and clear -- so it's listed here as the fallback. This is a one-time
  # startup probe, not continuous monitoring.
  device_fallback: [3]
  device_probe_ms: 300
  device_probe_rms_threshold: 50.0

vad:
  aggressiveness: 2       # webrtcvad 0..3 (higher = more aggressive filtering)
  start_frames: 3         # consecutive voiced frames to trigger "speech started"
  end_silence_ms: 600     # trailing silence that ends a segment
  max_segment_ms: 15000   # hard cap so a stuck mic can't buffer forever
  min_segment_ms: 250     # discard blips shorter than this

whisper:
  server_url: "http://127.0.0.1:8080"
  endpoint: "/inference"
  timeout_s: 30
  language: "auto"        # "auto" | "en" | "es" | ...
  # Whisper hallucination artifacts to discard on low-energy segments.
  hallucination_blocklist:
    - "thank you."
    - "thank you"
    - "thank you for watching"
    - "thanks for watching!"
    - "thanks for watching"
    - "please subscribe"
    - "like and subscribe"
    - "don't forget to subscribe"
    - "subtitles by the amara.org community"
    - "www.opensubtitles.org"
    - "you"
    - "bye"
    - "bye bye"
    - "goodbye"
    - "the following is a paid advertisement"
  # §5.4 watchdog: health-check the server on an interval, restart it when it
  # stops answering. restart_cmd is repo-relative unless absolute; set it to
  # null to disable auto-restart (health checks then only log). The restart
  # cap is per cooldown window, so a server that dies instantly (missing
  # model, broken binary) is retried max_restarts times, left alone for
  # cooldown_s, then retried again.
  watchdog:
    interval_s: 30
    restart_cmd: ["scripts/start_whisper_server.sh"]
    max_restarts: 3
    cooldown_s: 300

tts:
  voice: null             # null = system default `say` voice
  rate: 190               # words per minute
  max_inflight: 1         # sentences spoken concurrently (1 = strictly sequential)

tools:
  shell:
    # jarvis/tools/shell.py's run_command (ARCHITECTURE.md §5.3): binaries
    # the model may invoke via a shell command. Anything else is rejected
    # before a subprocess is even spawned -- this is the tool's entire
    # security boundary, so keep this list short and intentional.
    allowlist:
      - ls
      - cat
      - pwd
      - echo
      - grep
      - find
      - git
      - python3
      - pip3

# Which model table + fallback map below is live: "free" (OpenRouter free
# tier + NVIDIA NIM, $0 -- the production default) or "anthropic" (Claude
# models, paid -- the future upgrade path). The TIER_MODE env var overrides
# this, so flipping modes never needs a file edit. See jarvis/config.py's
# get_tier_mode and jarvis/llm/factory.py's resolve_models.
tier_mode: free

# Model routing: each tier names a provider + model, namespaced per tier
# mode. Switching providers, models, or the whole mode is a config change
# here, never a code change -- jarvis/llm/factory.py reads this and builds
# the matching Provider. See ARCHITECTURE.md §2/§6 and the free-mode
# restructure decision (2026-07-03).
#
# FREE MODE notes:
# - OpenRouter :free model IDs verified live against
#   openrouter.ai/collections/free-models on 2026-07-03. That catalog
#   rotates with little notice (typical free limits: ~20 req/min, ~200
#   req/day per model), which is exactly why every tier has an NVIDIA-twin
#   fallback (see fallbacks.free below).
# - NVIDIA NIM model IDs confirmed against NVIDIA's own docs, but NOT yet
#   live-verified (no NVIDIA_API_KEY in the dev environment). deepseek-r1 is
#   "free during preview" per NVIDIA -- recheck periodically.
# - The *_nvidia tiers are pure fallback targets, never router-resolved, so
#   they need no Layer B prompt file: LLMClient reuses the system prompt
#   resolved for the chain's starting tier across every hop.
# - t1_simple is the one exception to the "openrouter primary, nvidia
#   fallback" pattern above: google/gemma-4-31b-it:free was found live
#   (2026-07-04) to be persistently rate-limited on OpenRouter's shared free
#   pool, so every t1_simple turn was paying for a failed attempt before
#   falling over to NVIDIA. Swapped so NVIDIA is primary here and the
#   (renamed) t1_simple_openrouter is the fallback instead -- same two free
#   hops, just reordered for the one tier that was actually the bottleneck.
# - Reasoning models here (deepseek-r1, nemotron reasoning variants) inline
#   <think> blocks in their output; the OpenRouter/NVIDIA providers filter
#   those before TTS ever sees them (jarvis/llm/parsing.py).
#
# ANTHROPIC MODE notes:
# - This is the original pre-free-mode table, preserved intact as the paid
#   upgrade path. t1_simple stays on OpenRouter free even here (that was the
#   2026-07-02 provider-strategy decision).
# - thinking: none on t3_complex is required -- Fable 5 400s on an explicit
#   thinking config (ARCHITECTURE.md §2). On router it just keeps the
#   classifier snappy.
models:
  free:
    t1_simple:
      provider: nvidia
      model: "nvidia/nvidia-nemotron-nano-9b-v2"
      max_tokens: 1024
    t1_simple_openrouter:
      provider: openrouter
      model: "google/gemma-4-31b-it:free"
      max_tokens: 1024
    t1_standard:
      provider: openrouter
      model: "nvidia/nemotron-3-nano-30b-a3b:free"
      max_tokens: 2048
    t1_standard_nvidia:
      provider: nvidia
      model: "nvidia/llama-3.3-nemotron-super-49b-v1"
      max_tokens: 2048
    t2_medium:
      provider: openrouter
      model: "nvidia/nemotron-3-super-120b-a12b:free"
      max_tokens: 4096
    t2_medium_nvidia:
      provider: nvidia
      model: "nvidia/llama-3.3-nemotron-super-49b-v1"
      max_tokens: 4096
    t3_complex:
      provider: openrouter
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"
      max_tokens: 8192
    t3_complex_nvidia:
      provider: nvidia
      model: "deepseek-ai/deepseek-v4-pro"
      max_tokens: 8192
    router:
      provider: openrouter
      model: "openai/gpt-oss-20b:free"
      max_tokens: 400
    router_nvidia:
      provider: nvidia
      model: "nvidia/nvidia-nemotron-nano-9b-v2"
      max_tokens: 400
  anthropic:
    t1_simple:
      provider: openrouter
      model: "google/gemma-4-31b-it:free"
      max_tokens: 1024
    t1_simple_nvidia:
      provider: nvidia
      model: "nvidia/nvidia-nemotron-nano-9b-v2"
      max_tokens: 1024
    t1_standard:
      provider: anthropic
      model: "claude-sonnet-5"
      max_tokens: 8000
      effort: medium
    t2_medium:
      provider: anthropic
      model: "claude-opus-4-8"
      max_tokens: 16000
      effort: high
    t3_complex:
      provider: anthropic
      model: "claude-fable-5"
      max_tokens: 32000
      effort: high
      thinking: none
    router:
      provider: anthropic
      model: "claude-haiku-4-5"
      max_tokens: 1000
      thinking: none

# If a tier's provider call fails *before* streaming any text (and the
# failure is transient -- see jarvis/llm/fallbacks.py's is_transient), try
# this other tier's provider instead. jarvis/llm/client.py walks this map
# repeatedly (fallback_chain, up to 3 hops), so a tier degrades through a
# whole chain; a per-tier circuit breaker (3 consecutive failures -> 5 min
# cooldown) skips a tripped tier without even trying it. Namespaced per
# tier mode because the free chains hop through NVIDIA-twin tiers that
# don't belong in the paid ladder.
#
# free: every OpenRouter tier falls to its NVIDIA twin first (independent
#   catalog, independent rate limits), then degrades down the tier ladder --
#   e.g. t3_complex tries: nemotron-ultra -> deepseek-r1 -> nemotron-super
#   -> nemotron-49b. Worst case Z.E.R.O answers with a smaller free model
#   instead of not answering at all; nothing in this map ever costs money.
# anthropic: the original ladder -- t1_simple's two free hops upgrade to
#   paid Sonnet as the reliable backstop; t3/t2 degrade per ARCHITECTURE.md
#   §5.1 (Fable -> Opus -> Sonnet).
fallbacks:
  free:
    t1_simple: t1_simple_openrouter
    t1_simple_openrouter: t1_standard
    t1_standard: t1_standard_nvidia
    t1_standard_nvidia: t1_simple
    t2_medium: t2_medium_nvidia
    t2_medium_nvidia: t1_standard
    t3_complex: t3_complex_nvidia
    t3_complex_nvidia: t2_medium
    router: router_nvidia
  anthropic:
    t1_simple: t1_simple_nvidia
    t1_simple_nvidia: t1_standard
    t3_complex: t2_medium
    t2_medium: t1_standard

budget:
  soft_daily_usd: 3.0
  hard_daily_usd: 6.0

# Offline mode (§5.1's last rung): a cheap TCP connect probe decides whether
# LLM-bound turns even get attempted; T0 grammar commands always run. The
# verdict is cached for cache_ttl_s, and an observed transport failure on an
# LLM call marks us offline without a probe. See jarvis/core/offline.py.
offline:
  probe_host: "1.1.1.1"
  probe_port: 443
  probe_timeout_s: 1.5
  cache_ttl_s: 30

# M5 persistent memory (ARCHITECTURE.md §4). db_path is the SQLite episodic
# log + FTS5 recall index -- gitignored, local-only, rebuilds itself (schema
# only, not content) if deleted. digest_path is the curated core-memory file
# that's always injected into context -- tracked in git, hand-edited or
# updated via the `remember` tool. Both resolve relative to the repo root
# if not absolute; see jarvis/memory/__init__.py.
memory:
  db_path: "data/memory.sqlite3"
  digest_path: "memory/MEMORY.md"
