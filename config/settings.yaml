# Single source of truth for tunables. Code reads this — never hardcode model IDs
# or audio params. See ARCHITECTURE.md §6.

audio:
  sample_rate: 16000      # whisper.cpp + webrtcvad require 16 kHz mono
  channels: 1
  frame_ms: 30            # webrtcvad accepts only 10 / 20 / 30 ms frames
  device: null            # null = system default input device

vad:
  aggressiveness: 2       # webrtcvad 0..3 (higher = more aggressive filtering)
  start_frames: 3         # consecutive voiced frames to trigger "speech started"
  end_silence_ms: 600     # trailing silence that ends a segment
  max_segment_ms: 15000   # hard cap so a stuck mic can't buffer forever
  min_segment_ms: 250     # discard blips shorter than this

whisper:
  server_url: "http://127.0.0.1:8080"
  endpoint: "/inference"
  timeout_s: 30
  language: "auto"        # "auto" | "en" | "es" | ...
  # Whisper hallucination artifacts to discard on low-energy segments.
  hallucination_blocklist:
    - "thank you."
    - "thanks for watching!"
    - "subtitles by the amara.org community"
    - "you"

tts:
  voice: null             # null = system default `say` voice
  rate: 190               # words per minute
  max_inflight: 1         # sentences spoken concurrently (1 = strictly sequential)

# Model routing: each tier names a provider + model. Switching providers or
# models is a config change here, never a code change -- jarvis/llm/factory.py
# reads this and builds the matching Provider. See ARCHITECTURE.md §6/§8 and
# the provider-strategy research/decision recorded 2026-07-02.
#
# t1_simple now routes to OpenRouter's free tier instead of Haiku 4.5 (was
# the "simple" tier's backend before this decision) -- Haiku's remaining job
# is the M2 routing classifier below. Model ID verified live against
# OpenRouter's catalog (google/gemma-4-31b-it:free); that catalog rotates
# with little notice, which is exactly why t1_simple has a paid fallback.
#
# t2_medium/t3_complex are configured but not yet wired to a Layer B prompt
# or usable via Session/LLMClient -- that lands with later milestones
# (M4 tools, M3-full fallback ladder) per ARCHITECTURE.md §8.
models:
  t1_simple:
    provider: openrouter
    model: "google/gemma-4-31b-it:free"
    max_tokens: 1024
  t1_standard:
    provider: anthropic
    model: "claude-sonnet-5"
    max_tokens: 8000
    effort: medium
  t2_medium:
    provider: anthropic
    model: "claude-opus-4-8"
    max_tokens: 16000
    effort: high
  t3_complex:
    provider: anthropic
    model: "claude-fable-5"
    max_tokens: 32000
    effort: high
  router:
    provider: anthropic
    model: "claude-haiku-4-5"
    max_tokens: 1000

# If a tier's provider call fails *before* streaming any text, retry once
# against this other tier's provider instead (see jarvis/llm/client.py for
# why it's conditioned on "before any text" -- a mid-stream failure is not
# retried, to avoid garbling already-spoken output). Only t1_simple has one
# right now; the fuller multi-tier fallback ladder (circuit breakers, etc.)
# is ARCHITECTURE.md §5's "M3 full" milestone.
fallbacks:
  t1_simple: t1_standard

budget:
  soft_daily_usd: 3.0
  hard_daily_usd: 6.0
