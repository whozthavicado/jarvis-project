# Single source of truth for tunables. Code reads this — never hardcode model IDs
# or audio params. See ARCHITECTURE.md §6.

audio:
  sample_rate: 16000      # whisper.cpp + webrtcvad require 16 kHz mono
  channels: 1
  frame_ms: 30            # webrtcvad accepts only 10 / 20 / 30 ms frames
  device: null            # null = system default input device

vad:
  aggressiveness: 2       # webrtcvad 0..3 (higher = more aggressive filtering)
  start_frames: 3         # consecutive voiced frames to trigger "speech started"
  end_silence_ms: 600     # trailing silence that ends a segment
  max_segment_ms: 15000   # hard cap so a stuck mic can't buffer forever
  min_segment_ms: 250     # discard blips shorter than this

whisper:
  server_url: "http://127.0.0.1:8080"
  endpoint: "/inference"
  timeout_s: 30
  language: "auto"        # "auto" | "en" | "es" | ...
  # Whisper hallucination artifacts to discard on low-energy segments.
  hallucination_blocklist:
    - "thank you."
    - "thanks for watching!"
    - "subtitles by the amara.org community"
    - "you"

tts:
  voice: null             # null = system default `say` voice
  rate: 190               # words per minute
  max_inflight: 1         # sentences spoken concurrently (1 = strictly sequential)

# Model routing: each tier names a provider + model. Switching providers or
# models is a config change here, never a code change -- jarvis/llm/factory.py
# reads this and builds the matching Provider. See ARCHITECTURE.md §6/§8 and
# the provider-strategy research/decision recorded 2026-07-02.
#
# t1_simple now routes to OpenRouter's free tier instead of Haiku 4.5 (was
# the "simple" tier's backend before this decision) -- Haiku's remaining job
# is the M2 routing classifier below. Model ID verified live against
# OpenRouter's catalog (google/gemma-4-31b-it:free); that catalog rotates
# with little notice, which is exactly why t1_simple has a fallback chain.
#
# t1_simple_nvidia is a second, independent free option -- NVIDIA NIM's
# hosted catalog (build.nvidia.com), also free with rate limits. It's a pure
# fallback target, never the router's initially-resolved tier, so it doesn't
# need its own Layer B prompt file (LLMClient reuses whatever system_prompt
# the caller resolved for the *original* tier across every hop in the
# chain -- see jarvis/llm/client.py). Model ID not yet live-verified in this
# environment (no NVIDIA_API_KEY here) -- confirmed via NVIDIA's own docs as
# a real catalog entry; re-check against your account's available models if
# it's been a while.
models:
  t1_simple:
    provider: openrouter
    model: "google/gemma-4-31b-it:free"
    max_tokens: 1024
  t1_simple_nvidia:
    provider: nvidia
    model: "meta/llama-3.1-8b-instruct"
    max_tokens: 1024
  t1_standard:
    provider: anthropic
    model: "claude-sonnet-5"
    max_tokens: 8000
    effort: medium
  t2_medium:
    provider: anthropic
    model: "claude-opus-4-8"
    max_tokens: 16000
    effort: high
  t3_complex:
    provider: anthropic
    model: "claude-fable-5"
    max_tokens: 32000
    effort: high
  router:
    provider: anthropic
    model: "claude-haiku-4-5"
    max_tokens: 1000

# If a tier's provider call fails *before* streaming any text (and the
# failure is transient -- see jarvis/llm/fallbacks.py's is_transient), try
# this other tier's provider instead. jarvis/llm/client.py walks this map
# repeatedly (fallback_chain), so a tier can degrade through more than one
# hop:
#   t1_simple -> t1_simple_nvidia -> t1_standard
#     Two independent free catalogs (OpenRouter, then NVIDIA NIM) before
#     ever touching paid Sonnet -- an *upgrade* ladder, not a degrade one:
#     both free tiers are flaky/rotate, Sonnet is the reliable backstop.
#   t3_complex -> t2_medium -> t1_standard
#     Mirrors ARCHITECTURE.md §5.1's Fable -> Opus -> Sonnet degrade-under-
#     load ladder.
# A per-tier circuit breaker (3 consecutive failures -> 5 min cooldown)
# skips a tripped tier without even trying it.
fallbacks:
  t1_simple: t1_simple_nvidia
  t1_simple_nvidia: t1_standard
  t3_complex: t2_medium
  t2_medium: t1_standard

budget:
  soft_daily_usd: 3.0
  hard_daily_usd: 6.0

# M5 persistent memory (ARCHITECTURE.md §4). db_path is the SQLite episodic
# log + FTS5 recall index -- gitignored, local-only, rebuilds itself (schema
# only, not content) if deleted. digest_path is the curated core-memory file
# that's always injected into context -- tracked in git, hand-edited or
# updated via the `remember` tool. Both resolve relative to the repo root
# if not absolute; see jarvis/memory/__init__.py.
memory:
  db_path: "data/memory.sqlite3"
  digest_path: "memory/MEMORY.md"
